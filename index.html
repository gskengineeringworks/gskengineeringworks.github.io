        // --- Animation Wrapper Component ---

            const domRef = useRef();
            const [isVisible, setVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(entries => {
                    if (entries[0].isIntersecting) {
                        setVisible(true);
                        observer.unobserve(domRef.current);
                    }
                });
                observer.observe(domRef.current);
                return () => observer.disconnect();
            }, []);

            return (
                <div ref={domRef} className={`fade-in-section ${isVisible ? 'is-visible' : ''}`}>
                    {children}
                </div>
            );

              </FadeInSection>

        );


        const AboutSection = () => (
            <section id="about" className="bg-gray-100 py-20">
              <FadeInSection>
                <div className="container mx-auto px-6">
                    <div className="grid md:grid-cols-2 gap-16 items-center">
                        <div>
                             <h2 className="text-4xl font-bold text-zinc-800 mb-4">Over a Decade of Engineering Excellence</h2>
                            <div className="text-zinc-600 text-lg leading-relaxed space-y-4">
                                <p>Since 2008, GSK Engineering Works has been solving the toughest challenges in textile processing. We help mills across India increase throughput, reduce water consumption, and achieve unparalleled fabric quality through robust, custom-engineered machinery.</p>
                                 <p>Our commitment to quality is proven by our <strong>200+ machines deployed</strong> across the nation, serving a diverse range of clients in the textile industry.</p>
                            </div>
                        </div>
                        <div className="grid grid-cols-2 gap-8 text-center">
                            <div className="bg-white p-6 rounded-lg shadow-md">
                                 <h3 className="text-3xl font-bold text-red-600">2008</h3>
                                 <p className="text-zinc-600 mt-2">Founded</p>
                            </div>
                             <div className="bg-white p-6 rounded-lg shadow-md">
                                 <h3 className="text-3xl font-bold text-red-600">Quality</h3>
                                 <p className="text-zinc-600 mt-2">Assured</p>
                            </div>
                             <div className="bg-white p-6 rounded-lg shadow-md">
                                 <h3 className="text-3xl font-bold text-red-600">All India</h3>
                                 <p className="text-zinc-600 mt-2">Served</p>
                            </div>
                             <div className="bg-white p-6 rounded-lg shadow-md">
                                 <h3 className="text-3xl font-bold text-red-600">200+</h3>
                                 <p className="text-zinc-600 mt-2">Machines Deployed</p>
                            </div>
                        </div>
                    </div>
                </div>
              </FadeInSection>
            </section>
        );

        const ProductCard = ({ product, setView }) => (
             <button onClick={() => setView(product.id)} className="h-full flex flex-col text-left bg-white rounded-lg shadow-md overflow-hidden group transition duration-300 hover:shadow-xl hover:-translate-y-2">
                <div className="overflow-hidden">
                     <img src={product.cardImage} alt={product.name} className="w-full h-64 object-cover flex-shrink-0 transition-transform duration-300 group-hover:scale-110" />
                </div>
                <div className="p-6 flex flex-col flex-grow">
                    <h3 className="text-xl font-bold text-zinc-800 mb-2">{product.name}</h3>
                    <p className="text-zinc-600 mb-4 flex-grow">{product.shortDescription}</p>
                    <span className="font-bold text-red-600 group-hover:underline mt-auto">Learn More &rarr;</span>
                </div>
            </button>
        );


        const ProductsSection = ({ setView }) => (
            <section id="products" className="bg-white py-20">
              <FadeInSection>
                <div className="container mx-auto px-6">
                    <div className="text-center mb-12">
                        <h2 className="text-4xl font-bold text-zinc-800">Explore Our Machinery Categories</h2>
                    </div>
                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        {Object.values(products).map(product => (
                            <ProductCard key={product.id} product={product} setView={setView} />
                        ))}
                    </div>
                </div>
              </FadeInSection>
            </section>
        );

        const ContactSection = () => {
            const [formData, setFormData] = useState({ name: '', company: '', email: '', interest: Object.values(products)[0].name });
            const [formStatus, setFormStatus] = useState('');

            const handleChange = (e) => {
                const { id, value } = e.target;
                setFormData(prev => ({ ...prev, [id]: value }));
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                setFormStatus('sending');

                const serviceID = 'YOUR_SERVICE_ID'; 
                const templateID = 'YOUR_TEMPLATE_ID';
                const publicKey = 'YOUR_PUBLIC_KEY';

                const templateParams = {
                    name: formData.name,
                    company: formData.company,
                    email: formData.email,
                    interest: formData.interest,
                };

                emailjs.send(serviceID, templateID, templateParams, publicKey)
                    .then(() => {
                        setFormStatus('success');
                        setFormData({ name: '', company: '', email: '', interest: Object.values(products)[0].name });
                        setTimeout(() => setFormStatus(''), 5000);
                    }, (err) => {
                        setFormStatus('error');
                        console.error('EMAILJS FAILED...', err);
                        setTimeout(() => setFormStatus(''), 5000);
                    });
            };

            return (
                <section id="contact" className="bg-gray-100 py-20">
                  <FadeInSection>
                    <div className="container mx-auto px-6">
                        <div className="text-center mb-12">
                            <h2 className="text-4xl font-bold text-zinc-800">Speak with a Textile Machinery Expert Today</h2>
                            <p className="mt-4 text-lg text-zinc-600 max-w-2xl mx-auto">Complete the form below, and a GSK specialist will contact you to discuss your specific requirements and provide a tailored solution.</p>
                        </div>
                        <div className="grid md:grid-cols-2 gap-16 items-start">
                            <div className="bg-white p-8 rounded-lg shadow-lg">
                                <form onSubmit={handleSubmit}>
                                    <div className="space-y-6">
                                        <div>
                                            <label htmlFor="name" className="block text-sm font-medium text-zinc-700">Name</label>
                                            <input type="text" id="name" value={formData.name} onChange={handleChange} required className="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-red-500 focus:border-red-500"/>
                                        </div>
                                        <div>
                                            <label htmlFor="company" className="block text-sm font-medium text-zinc-700">Company</label>
                                            <input type="text" id="company" value={formData.company} onChange={handleChange} className="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-red-500 focus:border-red-500"/>
                                        </div>
                                        <div>
                                            <label htmlFor="email" className="block text-sm font-medium text-zinc-700">Email</label>
                                            <input type="email" id="email" value={formData.email} onChange={handleChange} required className="mt-1 block w-full px-3 py-2 bg-white border border-gray-300 rounded-md shadow-sm placeholder-gray-400 focus:outline-none focus:ring-red-500 focus:border-red-500"/>
                                        </div>
                                        <div>
                                            <label htmlFor="interest" className="block text-sm font-medium text-zinc-700">I am interested in...</label>
                                            <select id="interest" value={formData.interest} onChange={handleChange} className="mt-1 block w-full pl-3 pr-10 py-2 text-base border-gray-300 focus:outline-none focus:ring-red-500 focus:border-red-500 sm:text-sm rounded-md">
                                                {Object.values(products).map(p => <option key={p.id} value={p.name}>{p.name}</option>)}
                                                <option value="Other">Other</option>
                                            </select>
                                        </div>
                                        <div>
                                            <button type="submit" disabled={formStatus === 'sending'} className="w-full bg-red-600 text-white font-bold py-3 px-6 rounded-md hover:bg-red-700 transition duration-300 shadow-lg text-lg disabled:bg-red-400">
                                                {formStatus === 'sending' ? 'Sending...' : 'Get My Quote'}
                                            </button>
                                            {formStatus === 'success' && <p className="text-green-600 text-center mt-4">Your request has been sent successfully!</p>}
                                            {formStatus === 'error' && <p className="text-red-600 text-center mt-4">Failed to send. Please try again.</p>}
                                        </div>
                                    </div>
                                </form>
                            </div>
                            <div className="space-y-8">
                                <div className="flex items-start gap-4">
                                     <a href="https://www.google.co.in/maps/dir//30.885317, 75.924351" target="_blank" rel="noopener noreferrer" className="flex-shrink-0">
                                        <Icons.Location />
                                    </a>
                                    <div>
                                        <h3 className="text-xl font-bold text-zinc-800">Address</h3>
                                        <p className="text-zinc-600 mt-1">Plot No-F167, Phase-8, Focal Point, Ludhiana-141010, Punjab, India</p>
                                    </div>
                                </div>
                                 <div className="flex items-start gap-4">
                                    <div className="flex-shrink-0"><Icons.User /></div>
                                    <div>
                                        <h3 className="text-xl font-bold text-zinc-800">Contact Person</h3>
                                        <p className="text-zinc-600 mt-1">Neeraj Kapoor</p>
                                    </div>
                                </div>
                                 <div className="flex items-start gap-4">
                                    <div className="flex-shrink-0"><Icons.Phone /></div>
                                    <div>
                                        <h3 className="text-xl font-bold text-zinc-800">Phone Number</h3>
                                        <p className="text-zinc-600 mt-1">+91 9463704070</p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                  </FadeInSection>
                </section>
            );
        }


        const HomePage = ({ setView, scrollTo }) => (
            <React.Fragment>
                <HeroSection scrollTo={scrollTo} />
                <WhyChooseUsSection />
                <AboutSection />
                <ProductsSection setView={setView} />
                <ContactSection />
            </React.Fragment>
        );

        const ProductPage = ({ product, setView }) => (
            <main>
                <section className="bg-gray-100 py-12">
                  <FadeInSection>
                    <div className="container mx-auto px-6 text-center">
                        <h1 className="text-4xl md:text-5xl font-bold text-zinc-800">{product.hero.title}</h1>
                        <p className="mt-4 text-lg text-zinc-600 max-w-3xl mx-auto">{product.hero.subtitle}</p>
                    </div>
                  </FadeInSection>
                </section>

                <section className="py-20">
                    <div className="container mx-auto px-6 space-y-16">
                        {product.models.map((model, index) => (
                          <FadeInSection key={model.name}>
                            <div className="grid md:grid-cols-2 gap-12 items-center bg-white p-8 rounded-lg shadow-lg">
                                <div className={`w-full ${index % 2 !== 0 ? 'md:order-2' : ''}`}>
                                    <img src={model.imageUrl} alt={model.name} className="w-full h-96 object-cover rounded-md" />
                                </div>
                                <div className={index % 2 !== 0 ? 'md:order-1' : ''}>
                                    <h2 className="text-3xl font-bold text-zinc-800 mb-4">{model.name}</h2>
                                    <p className="text-zinc-600 mb-6 leading-relaxed">{model.description}</p>
                                    
                                    <div className="mb-6">
                                        <h3 className="text-xl font-bold text-zinc-800 mb-3">Key Benefits:</h3>
                                        <ul className="space-y-2">
                                           {model.benefits.map(benefit => (
                                                <li key={benefit} className="flex items-center">
                                                    <Icons.Check />
                                                    <span className="ml-2 text-zinc-600">{benefit}</span>
                                                </li>
                                           ))}
                                        </ul>
                                    </div>

                                    <div>
                                        <h3 className="text-xl font-bold text-zinc-800 mb-3">{model.details.type}:</h3>
                                        <ul className="list-disc list-inside text-zinc-600 space-y-2">
                                           {model.details.points.map(point => <li key={point}>{point}</li>)}
                                        </ul>
                                    </div>
                                </div>
                            </div>
                          </FadeInSection>
                        ))}
                    </div>
                </section>

                <section className="bg-gray-100 py-20">
                  <FadeInSection>
                    <div className="container mx-auto px-6">
                        <div className="text-center mb-12">
                            <h2 className="text-4xl font-bold text-zinc-800">Explore More Categories</h2>
                        </div>
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-8">
                            {Object.values(products).filter(p => p.id !== product.id).map(p => (
                                 <button key={p.id} onClick={() => setView(p.id)} className="block text-left bg-white rounded-lg shadow-md overflow-hidden group transition duration-300 hover:shadow-xl hover:-translate-y-1">
                                    <img src={p.cardImage} alt={p.name} className="w-full h-48 object-cover" />
                                    <div className="p-6">
                                        <h3 className="text-lg font-bold text-zinc-800">{p.name}</h3>
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>
                  </FadeInSection>
                </section>
            </main>
        );

        function App() {
            const [view, setView] = useState('home');
            
            const scrollTo = (sectionId) => {
                setTimeout(() => {
                    const section = document.getElementById(sectionId);
                    if (section) {
                        section.scrollIntoView({ behavior: 'smooth' });
                    }
                }, 0);
            };
            
            useEffect(() => {
                window.scrollTo(0, 0);
            }, [view]);

            const renderView = () => {
                if (view === 'home') {
                    return <HomePage setView={setView} scrollTo={scrollTo} />;
                }
                if (products[view]) {
                    return <ProductPage product={products[view]} setView={setView} />;
                }
                return <HomePage setView={setView} scrollTo={scrollTo} />;
            };

            return (
                <div className="bg-white">
                    <Header setView={setView} scrollTo={scrollTo} />
                    {renderView()}
                    <Footer setView={setView} scrollTo={scrollTo} />
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);

    </script>
</body>
</html>
